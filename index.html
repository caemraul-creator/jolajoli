<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/bs5/jqc-1.12.4/dt-1.13.1/datatables.min.css"/>
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/fixedheader/3.3.1/css/fixedHeader.bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/responsive/2.4.0/css/responsive.bootstrap.min.css">
        <title>DailyNota</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                padding: 20px 0;
            }

            .main-container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                padding: 20px;
                margin: 0 auto;
                max-width: 1400px;
                width: 95%;
            }

            .page-title {
                font-size: 2rem;
                font-weight: 700;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 20px;
                text-align: center;
            }

            .version-info {
                text-align: center;
                font-size: 0.75rem;
                color: #999;
                margin-bottom: 15px;
                font-weight: 500;
            }

            .btn-add {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                padding: 8px 16px;
                border-radius: 10px;
                color: white;
                font-weight: 600;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
                width: auto;
                margin-bottom: 15px;
                order: 0;
                font-size: 0.9rem;
            }

            .btn-add:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
                color: white;
            }

            .table-wrapper {
                background: white;
                border-radius: 15px;
                padding: 0;
                margin-top: 15px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
                overflow-x: auto;
                display: flex;
                flex-direction: column;
            }

            #table_data {
                border-radius: 10px;
                overflow: hidden;
                margin-bottom: 0;
                order: 3;
            }

            #table_data thead {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            #table_data thead th {
                border: none;
                padding: 12px 8px;
                font-weight: 600;
                text-transform: uppercase;
                font-size: 0.75rem;
                letter-spacing: 0.5px;
                white-space: nowrap;
                text-align: center;
            }

            #table_data tbody tr {
                transition: all 0.3s ease;
            }

            #table_data tbody tr:hover {
                background-color: #f8f9ff;
            }

            #table_data tbody td {
                padding: 10px 8px;
                vertical-align: middle;
                font-size: 0.9rem;
            }

            .btn-warning {
                background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                border: none;
                padding: 8px 15px;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                transition: all 0.3s ease;
                font-size: 0.85rem;
                white-space: nowrap;
            }

            .btn-warning:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
                color: white;
            }

            .btn-info {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                padding: 8px 15px;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                transition: all 0.3s ease;
                font-size: 0.85rem;
                white-space: nowrap;
                margin-left: 5px;
            }

            .btn-info:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
                color: white;
            }

            .modal-dialog {
                max-width: 400px;
            }

            .modal-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border-radius: 20px 20px 0 0;
                padding: 12px 16px;
                border: none;
            }

            .modal-header .modal-title {
                font-weight: 700;
                font-size: 1rem;
            }

            .modal-header .btn-close {
                filter: brightness(0) invert(1);
            }

            .modal-body {
                padding: 15px;
            }

            .modal-body .form-label {
                font-weight: 600;
                color: #333;
                margin-bottom: 4px;
                font-size: 0.85rem;
            }

            .modal-body .form-control,
            .modal-body .form-select {
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                padding: 8px 10px;
                transition: all 0.3s ease;
                font-size: 0.9rem;
            }

            .modal-body .form-control:focus,
            .modal-body .form-select:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }

            .mb-3 {
                margin-bottom: 10px !important;
            }

            .modal-footer {
                border: none;
                padding: 12px 15px;
                gap: 10px;
            }

            .modal-footer .btn-success {
                background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
                border: none;
                padding: 10px 25px;
                border-radius: 10px;
                font-weight: 600;
                transition: all 0.3s ease;
                flex: 1;
                font-size: 0.9rem;
            }

            .modal-footer .btn-success:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
            }

            .dataTables_wrapper {
                display: flex;
                flex-direction: column;
            }

            .dataTables_wrapper .dataTables_filter {
                text-align: right;
                margin-bottom: 15px;
                padding: 0;
            }

            .dataTables_wrapper .dataTables_filter label {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                color: #667eea;
                font-size: 0.9rem;
            }

            .dataTables_wrapper .dataTables_filter input {
                border: 2px solid #e0e0e0;
                border-radius: 12px;
                padding: 10px 15px;
                margin-left: 0;
                width: 250px;
                transition: all 0.3s ease;
                background: #f8f9ff;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_filter input:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
                background: white;
            }

            .dataTables_wrapper .dataTables_filter input::placeholder {
                color: #999;
            }

            .dataTables_wrapper .dataTables_length {
                float: none;
                margin-bottom: 0;
                padding: 0;
                order: 2;
            }

            .dataTables_wrapper .dataTables_length label {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                color: #667eea;
                font-size: 0.9rem;
                margin: 0;
            }

            .dataTables_wrapper .dataTables_length select {
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                padding: 8px 12px;
                background: #f8f9ff;
                transition: all 0.3s ease;
                cursor: pointer;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_length select:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
                background: white;
            }

            .dataTables_wrapper .dataTables_info {
                padding: 10px;
                font-size: 0.85rem;
                color: #666;
                font-weight: 500;
                order: 4;
            }

            .dataTables_wrapper .dataTables_paginate {
                padding: 10px;
                order: 5;
                display: flex;
                justify-content: flex-end;
                gap: 5px;
                flex-wrap: wrap;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button {
                padding: 6px 8px !important;
                border-radius: 4px !important;
                margin: 0 1px !important;
                font-size: 0.85rem !important;
                font-weight: 500 !important;
                color: #333 !important;
                background: transparent !important;
                border: none !important;
                cursor: pointer !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.current {
                background: transparent !important;
                border: none !important;
                color: #333 !important;
                border-radius: 4px;
                font-weight: 700 !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
                background: transparent !important;
                border: none !important;
                color: #667eea !important;
                border-radius: 4px;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.disabled {
                color: #999 !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.current {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                border: none !important;
                color: white !important;
                border-radius: 8px;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                border: none !important;
                color: white !important;
                border-radius: 8px;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.previous {
                border: none !important;
                background: transparent !important;
                padding: 0 6px !important;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.previous span.dt-prev {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #fff;
                box-shadow: 0 6px 16px rgba(102, 126, 234, 0.35);
                font-weight: 700;
                line-height: 1;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.previous:hover {
                background: transparent !important;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.previous:active span.dt-prev {
                transform: translateY(1px);
            }

            /* Mobile Responsive */
            @media (max-width: 768px) {
                .main-container {
                    padding: 15px;
                    width: 100%;
                    border-radius: 15px;
                }

                .page-title {
                    font-size: 1.5rem;
                    margin-bottom: 15px;
                }

                .btn-add {
                    padding: 10px 15px;
                    font-size: 0.95rem;
                }

                .table-wrapper {
                    padding: 10px;
                }

                #table_data thead th {
                    padding: 8px 5px;
                    font-size: 0.7rem;
                }

                #table_data tbody td {
                    padding: 8px 5px;
                    font-size: 0.8rem;
                }

                .btn-warning {
                    padding: 6px 10px;
                    font-size: 0.75rem;
                }

                .modal-body {
                    padding: 15px;
                }

                .modal-body .form-label {
                    font-size: 0.9rem;
                    margin-bottom: 5px;
                }

                .modal-body .form-control,
                .modal-body .form-select {
                    padding: 8px 10px;
                    font-size: 16px;
                }

                .modal-header .modal-title {
                    font-size: 1.1rem;
                }

                .dataTables_wrapper .dataTables_filter label,
                .dataTables_wrapper .dataTables_length label {
                    font-size: 0.85rem;
                }

                .dataTables_wrapper .dataTables_filter input {
                    font-size: 0.9rem;
                    padding: 8px 12px;
                }

                .dataTables_wrapper .dataTables_info {
                    font-size: 0.75rem;
                }

                .dataTables_wrapper .dataTables_paginate .paginate_button {
                    padding: 4px 6px !important;
                }
            }

            @media (max-width: 576px) {
                body {
                    padding: 10px 0;
                }

                .main-container {
                    padding: 12px;
                    margin: 0 auto;
                }

                .page-title {
                    font-size: 1.3rem;
                }

                #table_data thead th {
                    padding: 6px 3px;
                    font-size: 0.65rem;
                }

                #table_data tbody td {
                    padding: 6px 3px;
                    font-size: 0.75rem;
                }

                .btn-warning {
                    padding: 5px 8px;
                    font-size: 0.7rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="main-container">
                <h1 class="page-title">DailyNota</h1>
                <div class="version-info">v1.0 © 2025</div>
                
                <button type="button" class="btn btn-add" id="tambahProduk">
                    + Tambah Produk
                </button>
                
                <div class="table-wrapper">
                    <table
                        id="table_data"
                        class="table table-striped table-bordered"
                        style="width: 100%"
                    ></table>
                </div>
            </div>
        </div>
       
        <div class="modal" id="myModal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
            
                    <div class="modal-header">
                    <h4 class="modal-title">Tambah Produk</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
            
                    <div class="modal-body">
                        <form>
                            <input type="hidden" class="form-control" id="idProduk">
                            <div class="mb-3">
                                <label for="itemsProduk" class="col-form-label">Items</label>
                                <input type="text" class="form-control" id="itemsProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="supplierProduk" class="col-form-label">Supplier</label>
                                <input type="text" class="form-control" id="supplierProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="kotaProduk" class="col-form-label">Kota</label>
                                <input type="text" class="form-control" id="kotaProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="gudangProduk" class="col-form-label">Gudang</label>
                                <select class="form-control" id="gudangProduk" required>
                                    <option value="">Pilih Gudang</option>
                                    <option value="Kalipucang">Kalipucang</option>
                                    <option value="Sekarjati">Sekarjati</option>
                                    <option value="Troso">Troso</option>
                                    <option value="Ngabul">Ngabul</option>
                                    <option value="Masterbox">Masterbox</option>
                                    <option value="Innerbox">Innerbox</option>
                                    <option value="Flexo">Flexo</option>
                                    <option value="Mess">Mess</option>
                                    <option value="Kontrakan">Kontrakan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="tanggalProduk" class="col-form-label">Tanggal</label>
                                <input type="text" class="form-control" id="tanggalProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="hargaProduk" class="col-form-label">Harga</label>
                                <input type="text" class="form-control" id="hargaProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="satuanProduk" class="col-form-label">Satuan</label>
                                <select class="form-control" id="satuanProduk" required>
                                    <option value="klg">klg</option>
                                    <option value="ml">ml</option>
                                    <option value="ons">ons</option>
                                    <option value="gr">gr</option>
                                    <option value="pcs">pcs</option>
                                    <option value="lbr">lbr</option>
                                    <option value="btg">btg</option>
                                    <option value="roll">roll</option>
                                    <option value="kg">kg</option>
                                    <option value="ltr">ltr</option>
                                    <option value="m">m</option>
                                    <option value="cm">cm</option>
                                    <option value="box">box</option>
                                    <option value="pack">pack</option>
                                    <option value="unit">unit</option>
                                    <option value="set">set</option>
                                    <option value="rtg">rtg</option>
                                    <option value="lsn">lsn</option>
                                    <option value="gln">gln</option>
                                    <option value="lainnya">lainnya</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="stokProduk" class="col-form-label">Stok</label>
                                <input type="text" class="form-control" id="stokProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="deskripsiProduk" class="col-form-label">Deskripsi</label>
                                <textarea class="form-control" id="deskripsiProduk" rows="3" placeholder="Opsional"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="flex: 1;">Batal</button>
                        <button type="button" class="btn btn-success" style="flex: 1;">Simpan</button>
                    </div>
            
                </div>
            </div>
        </div>
        

        <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" src="https://cdn.datatables.net/v/bs5/jqc-1.12.4/dt-1.13.1/datatables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.3/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.3/js/dataTables.bootstrap.min.js"></script>
        <script src="https://cdn.datatables.net/fixedheader/3.3.1/js/dataTables.fixedHeader.min.js"></script>
        <script src="https://cdn.datatables.net/responsive/2.4.0/js/dataTables.responsive.min.js"></script>
        <script src="https://cdn.datatables.net/responsive/2.4.0/js/responsive.bootstrap.min.js"></script>
        <script>
            $(document).ready(function () {
                const BASE_URL = "https://script.google.com/macros/s/AKfycbzbG6txwc0bnhJq2W3ABEeGCUHF2lh_gwGLIKXBGnAlfCIwvOlo32fQdtpCQwFisQ/exec";
               
                const table = $("#table_data").DataTable({
                    ajax: BASE_URL + "?action=get-product",
                    columns: [
                        {
                            title: "NO",
                            data: "id"
                        },
                        {
                            title: "ITEMS",
                            data: "items"
                        },
                        {
                            title: "SUPPLIER",
                            data: "supplier"
                        },
                        {
                            title: "KOTA",
                            data: "kota"
                        },
                        {
                            title: "GUDANG",
                            data: "gudang"
                        },
                        {
                            title: "TANGGAL",
                            data: "tanggal",
                            render: function(data, type, row) {
                                if (type === 'display' && data) {
                                    let date = new Date(data);
                                    if (!isNaN(date.getTime())) {
                                        let day = String(date.getDate()).padStart(2, '0');
                                        let month = String(date.getMonth() + 1).padStart(2, '0');
                                        let year = date.getFullYear();
                                        return `${day}/${month}/${year}`;
                                    }
                                    return data;
                                }
                                return data;
                            }
                        },
                        {
                            title: "HARGA",
                            data: "harga",
                            className: "text-end",
                            render: function(data, type, row) {
                                if (type === 'display') {
                                    const number = parseFloat(data);
                                    if (isNaN(number)) return data;
                                    return number.toLocaleString('id-ID');
                                }
                                return data;
                            }
                        },
                        {
                            title: "SATUAN",
                            data: "satuan"
                        },
                        {
                            title: "STOK",
                            data: "stok",
                            visible: false
                        },
                        {
                            title: "EDIT",
                            targets: -1,
                            data: null,
                            defaultContent: '<button class="btn btn-warning" id="edit">Edit</button> <button class="btn btn-info" id="view">Lihat</button>'
                        }
                       
                    ],
                    rawId: "id",
                    liveAjax: true,
                    responsive: true,
                    language: {
                        paginate: {
                            previous: '<span class="dt-prev" aria-label="Sebelumnya">‹</span>'
                        }
                    }
                })

                $('#tambahProduk').on('click', () => {
                    clear();
                    $('#myModal').modal('show');
                    $('#myModal .modal-title').text('Tambah Produk');
                })

                $('#table_data tbody').on('click', '#edit', function () {
                    const data = table.row($(this).parents('tr')).data();
                    console.log(data);
                    $('#idProduk').val(data.id);
                    $('#itemsProduk').val(data.items);
                    $('#supplierProduk').val(data.supplier);
                    $('#kotaProduk').val(data.kota);
                    $('#gudangProduk').val(data.gudang);
                    $('#tanggalProduk').val(data.tanggal);
                    $('#hargaProduk').val(data.harga);
                    $('#satuanProduk').val(data.satuan);
                    $('#stokProduk').val(data.stok);
                    $('#deskripsiProduk').val(data.deskripsi || '');
                    $('#myModal').modal('show');
                    $('#myModal .modal-title').text('Edit Produk');
                })

                $('#table_data tbody').on('click', '#view', function () {
                    const data = table.row($(this).parents('tr')).data();
                    const deskripsi = data.deskripsi || 'Tidak ada deskripsi';
                    alert('Deskripsi: ' + deskripsi);
                })

                $('.modal-footer .btn-success').on('click', () => {
                    const itemsProduk = $('#itemsProduk').val();
                    const supplierProduk = $('#supplierProduk').val();
                    const kotaProduk = $('#kotaProduk').val();
                    const gudangProduk = $('#gudangProduk').val();
                    const tanggalProduk = $('#tanggalProduk').val();
                    const hargaProduk = $('#hargaProduk').val();
                    const satuanProduk = $('#satuanProduk').val();
                    const stokProduk = $('#stokProduk').val();
                    const deskripsiProduk = $('#deskripsiProduk').val();
                    const idProduk = $('#idProduk').val();

                    if (itemsProduk == '' || supplierProduk == '' || kotaProduk == '' || gudangProduk == '' || tanggalProduk == '' || hargaProduk == '' || satuanProduk == '' || stokProduk == '') {
                        alert('Harap lengkapi semua field !')
                        return
                    }

                    let apiUrl = '';

                    if (idProduk) {
                        apiUrl = `${BASE_URL}?action=update&items=${itemsProduk}&supplier=${supplierProduk}&kota=${kotaProduk}&gudang=${gudangProduk}&tanggal=${tanggalProduk}&harga=${hargaProduk}&satuan=${satuanProduk}&stok=${stokProduk}&deskripsi=${encodeURIComponent(deskripsiProduk)}&id=${idProduk}`;
                    } else {
                        apiUrl = `${BASE_URL}?action=insert&items=${itemsProduk}&supplier=${supplierProduk}&kota=${kotaProduk}&gudang=${gudangProduk}&tanggal=${tanggalProduk}&harga=${hargaProduk}&satuan=${satuanProduk}&stok=${stokProduk}&deskripsi=${encodeURIComponent(deskripsiProduk)}`;
                    }

                    $.getJSON(apiUrl, function(result) {
                        alert(result.message);
                        location.reload();
                    })
                })
            })

            function clear() {
                $('#idProduk').val('');
                $('#itemsProduk').val('');
                $('#supplierProduk').val('');
                $('#kotaProduk').val('');
                $('#gudangProduk').val('');
                $('#tanggalProduk').val('');
                $('#hargaProduk').val('');
                $('#satuanProduk').val('');
                $('#stokProduk').val('');
                $('#deskripsiProduk').val('');
            }

        </script>
    </body>
</html>
