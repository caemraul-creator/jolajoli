<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/bs5/jqc-1.12.4/dt-1.13.1/datatables.min.css"/>
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/fixedheader/3.3.1/css/fixedHeader.bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/responsive/2.4.0/css/responsive.bootstrap.min.css">
        <title>DailyNota</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                padding: 40px 0;
            }

            .main-container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                padding: 40px;
                margin: 0 auto;
                max-width: 1400px;
            }

            .page-title {
                font-size: 2.5rem;
                font-weight: 700;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 30px;
                text-align: center;
            }

            .btn-add {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                padding: 12px 30px;
                border-radius: 10px;
                color: white;
                font-weight: 600;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            }

            .btn-add:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
                color: white;
            }

            .table-wrapper {
                background: white;
                border-radius: 15px;
                padding: 20px;
                margin-top: 15px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            }

            #table_data {
                border-radius: 10px;
                overflow: hidden;
            }

            #table_data thead {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            #table_data thead th {
                border: none;
                padding: 15px;
                font-weight: 600;
                text-transform: uppercase;
                font-size: 0.85rem;
                letter-spacing: 0.5px;
            }

            #table_data tbody tr {
                transition: all 0.3s ease;
            }

            #table_data tbody tr:hover {
                background-color: #f8f9ff;
                transform: scale(1.01);
            }

            #table_data tbody td {
                padding: 15px;
                vertical-align: middle;
            }

            .btn-warning {
                background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                border: none;
                padding: 8px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .btn-warning:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
                color: white;
            }

            .modal-content {
                border-radius: 20px;
                border: none;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }

            .modal-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border-radius: 20px 20px 0 0;
                padding: 20px 30px;
                border: none;
            }

            .modal-header .modal-title {
                font-weight: 700;
                font-size: 1.5rem;
            }

            .modal-header .btn-close {
                filter: brightness(0) invert(1);
            }

            .modal-body {
                padding: 30px;
            }

            .modal-body .form-label {
                font-weight: 600;
                color: #333;
                margin-bottom: 8px;
            }

            .modal-body .form-control,
            .modal-body .form-select {
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                padding: 12px 15px;
                transition: all 0.3s ease;
            }

            .modal-body .form-control:focus,
            .modal-body .form-select:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }

            .modal-footer {
                border: none;
                padding: 20px 30px;
            }

            .modal-footer .btn-success {
                background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
                border: none;
                padding: 12px 30px;
                border-radius: 10px;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .modal-footer .btn-success:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
            }

            .dataTables_wrapper .dataTables_filter {
                float: right;
                text-align: right;
                margin-bottom: 10px;
            }

            .dataTables_wrapper .dataTables_filter label {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                color: #667eea;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_filter input {
                border: 2px solid #e0e0e0;
                border-radius: 12px;
                padding: 10px 20px;
                margin-left: 0;
                width: 280px;
                transition: all 0.3s ease;
                background: #f8f9ff;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_filter input:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
                background: white;
            }

            .dataTables_wrapper .dataTables_filter input::placeholder {
                color: #999;
            }

            .dataTables_wrapper .dataTables_length {
                float: left;
                margin-bottom: 15px;
            }

            .dataTables_wrapper .dataTables_length label {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                color: #667eea;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_length select {
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                padding: 8px 12px;
                background: #f8f9ff;
                transition: all 0.3s ease;
                cursor: pointer;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_length select:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
                background: white;
            }

            .dataTables_wrapper .dataTables_info {
                padding-top: 15px;
                font-size: 0.9rem;
                color: #666;
                font-weight: 500;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.current {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                border: none !important;
                color: white !important;
                border-radius: 8px;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                border: none !important;
                color: white !important;
                border-radius: 8px;
            }

            /* Elegant "Previous" button styling */
            .dataTables_wrapper .dataTables_paginate .paginate_button.previous {
                border: none !important;
                background: transparent !important;
                padding: 0 6px !important;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.previous span.dt-prev {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #fff;
                box-shadow: 0 6px 16px rgba(102, 126, 234, 0.35);
                font-weight: 700;
                line-height: 1;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.previous:hover {
                background: transparent !important;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.previous:active span.dt-prev {
                transform: translateY(1px);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="main-container">
                <h1 class="page-title">DailyNota</h1>
                
                <!-- Button trigger modal -->
                <button type="button" class="btn btn-add" id="tambahProduk">
                    + Tambah Produk
                </button>
                
                <div class="table-wrapper">
                    <table
                        id="table_data"
                        class="table table-striped table-bordered"
                        style="width: 100%"
                    ></table>
                </div>
            </div>
        </div>
       <!-- The Modal -->
        <div class="modal" id="myModal">
            <div class="modal-dialog">
                <div class="modal-content">
            
                    <!-- Modal Header -->
                    <div class="modal-header">
                    <h4 class="modal-title">Tambah Produk</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
            
                    <!-- Modal body -->
                    <div class="modal-body">
                        <form>
                            <input type="hidden" class="form-control" id="idProduk">
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Items</label>
                                <input type="text" class="form-control" id="itemsProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Supplier</label>
                                <input type="text" class="form-control" id="supplierProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Kota</label>
                                <input type="text" class="form-control" id="kotaProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Gudang</label>
                                <select class="form-control" id="gudangProduk" required>
                                    <option value="">Pilih Gudang</option>
                                    <option value="Kalipucang">Kalipucang</option>
                                    <option value="Sekarjati">Sekarjati</option>
                                    <option value="Troso">Troso</option>
                                    <option value="Ngabul">Ngabul</option>
                                    <option value="Masterbox">Masterbox</option>
                                    <option value="Innerbox">Innerbox</option>
                                    <option value="Flexo">Flexo</option>
                                    <option value="Mess">Mess</option>
                                    <option value="Kontrakan">Kontrakan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Tanggal</label>
                                <input type="text" class="form-control" id="tanggalProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Harga</label>
                                <input type="text" class="form-control" id="hargaProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Satuan</label>
                                <select class="form-control" id="satuanProduk" required>
                                    <option value="klg">klg</option>
                                    <option value="ml">ml</option>
                                    <option value="ons">ons</option>
                                    <option value="gr">gr</option>
                                    <option value="pcs">pcs</option>
                                    <option value="lbr">lbr</option>
                                    <option value="btg">btg</option>
                                    <option value="roll">roll</option>
                                    <option value="kg">kg</option>
                                    <option value="ltr">ltr</option>
                                    <option value="m">m</option>
                                    <option value="cm">cm</option>
                                    <option value="box">box</option>
                                    <option value="pack">pack</option>
                                    <option value="unit">unit</option>
                                    <option value="set">set</option>
                                    <option value="rtg">rtg</option>
                                    <option value="lsn">lsn</option>
                                    <option value="gln">gln</option>
                                    <option value="lainnya">lainnya</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Stok</label>
                                <input type="tex" class="form-control" id="stokProduk" required>
                            </div>
                            
                        </form>
                    </div>
                    <!-- Modal footer -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success" data-bs-dismiss="modal">Simpan</button>
                    </div>
            
                </div>
            </div>
        </div>
        

        <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" src="https://cdn.datatables.net/v/bs5/jqc-1.12.4/dt-1.13.1/datatables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.3/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.3/js/dataTables.bootstrap.min.js"></script>
        <script src="https://cdn.datatables.net/fixedheader/3.3.1/js/dataTables.fixedHeader.min.js"></script>
        <script src="https://cdn.datatables.net/responsive/2.4.0/js/dataTables.responsive.min.js"></script>
        <script src="https://cdn.datatables.net/responsive/2.4.0/js/responsive.bootstrap.min.js"></script>
        <script>
            $(document).ready(function () {
                const BASE_URL = "https://script.google.com/macros/s/AKfycbwNqNIq6AYqePYpBwnfIrGuXFJNkZXWLVpP15gJdQFfIxz74S5V-1mvwS1qPAFICJpJ/exec";
               
                const table = $("#table_data").DataTable({
                    ajax: BASE_URL + "?action=get-product",
                    columns: [
                        {
                            title: "NO",
                            data: "id"
                        },
                        {
                            title: "ITEMS",
                            data: "items"
                        },
                        {
                            title: "SUPPLIER",
                            data: "supplier"
                        },
                        {
                            title: "KOTA",
                            data: "kota"
                        },
                        {
                            title: "GUDANG",
                            data: "gudang"
                        },
                        {
                            title: "TANGGAL",
                            data: "tanggal",
                            render: function(data, type, row) {
                                if (type === 'display' && data) {
                                    // Try to parse the date
                                    let date = new Date(data);
                                    
                                    // Check if date is valid
                                    if (!isNaN(date.getTime())) {
                                        let day = String(date.getDate()).padStart(2, '0');
                                        let month = String(date.getMonth() + 1).padStart(2, '0');
                                        let year = date.getFullYear();
                                        return `${day}/${month}/${year}`;
                                    }
                                    
                                    // If already in dd/mm/yyyy format, return as is
                                    return data;
                                }
                                return data;
                            }
                        },
                        {
                            title: "HARGA",
                            data: "harga",
                            className: "text-end",
                            render: function(data, type, row) {
                                if (type === 'display') {
                                    // Format number with thousand separator
                                    const number = parseFloat(data);
                                    if (isNaN(number)) return data;
                                    return number.toLocaleString('id-ID');
                                }
                                return data;
                            }
                        },
                        {
                            title: "SATUAN",
                            data: "satuan"
                        },
                        {
                            title: "STOK",
                            data: "stok"
                        },
                        {
                            title: "EDIT",
                            targets: -1,
                            data: null,
                            defaultContent: '<button class="btn btn-warning" id="edit">Edit</button>'
                        }
                       
                    ],
                    rawId: "id",
                    liveAjax: true,
                    responsive: true,
                    language: {
                        paginate: {
                            previous: '<span class="dt-prev" aria-label="Sebelumnya">‹</span>'
                        }
                    }
                })

                $('#tambahProduk').on('click', () => {
                    clear();
                    $('#myModal').modal('show');
                    $('#myModal .modal-title').text('Tambah Produk');
                })

                $('#table_data tbody').on('click', '#edit', function () {
                    const data = table.row($(this).parents('tr')).data();
                    console.log(data);
                    $('#idProduk').val(data.id);
                    $('#itemsProduk').val(data.items);
                    $('#supplierProduk').val(data.supplier);
                    $('#kotaProduk').val(data.kota);
                    $('#gudangProduk').val(data.gudang);
                    $('#tanggalProduk').val(data.tanggal);
                    $('#hargaProduk').val(data.harga);
                    $('#satuanProduk').val(data.satuan);
                    $('#stokProduk').val(data.stok);
                    $('#myModal').modal('show');
                    $('#myModal .modal-title').text('Edit Produk');
                })

                $('.modal-footer .btn-success').on('click', () => {
                    const itemsProduk = $('#itemsProduk').val();
                    const supplierProduk = $('#supplierProduk').val();
                    const kotaProduk = $('#kotaProduk').val();
                    const gudangProduk = $('#gudangProduk').val();
                    const tanggalProduk = $('#tanggalProduk').val();
                    const hargaProduk = $('#hargaProduk').val();
                    const satuanProduk = $('#satuanProduk').val();
                    const stokProduk = $('#stokProduk').val();
                    const idProduk = $('#idProduk').val();

                    if (itemsProduk == '' || supplierProduk == '' || kotaProduk == '' || gudangProduk == '' || tanggalProduk == '' || hargaProduk == '' || satuanProduk == '' || stokProduk == '') {
                        alert('Harap lengkapi semua field !')
                        return
                    }

                    let apiUrl = '';

                    if (idProduk) {
                        apiUrl = `${BASE_URL}?action=update&items=${itemsProduk}&supplier=${supplierProduk}&kota=${kotaProduk}&gudang=${gudangProduk}&tanggal=${tanggalProduk}&harga=${hargaProduk}&satuan=${satuanProduk}&stok=${stokProduk}&id=${idProduk}`;
                    } else {
                        apiUrl = `${BASE_URL}?action=insert&items=${itemsProduk}&supplier=${supplierProduk}&kota=${kotaProduk}&gudang=${gudangProduk}&tanggal=${tanggalProduk}&harga=${hargaProduk}&satuan=${satuanProduk}&stok=${stokProduk}`;
                    }

                    $.getJSON(apiUrl, function(result) {
                        alert(result.message);
                        location.reload();
                    })
                })
            })

            function clear() {
                $('#idProduk').val('');
                $('#itemsProduk').val('');
                $('#supplierProduk').val('');
                $('#kotaProduk').val('');
                $('#gudangProduk').val('');
                $('#tanggalProduk').val('');
                $('#hargaProduk').val('');
                $('#satuanProduk').val('');
                $('#stokProduk').val('');
            }

        </script>
    </body>
</html>
