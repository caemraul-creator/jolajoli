<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css"/>
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/bs5/jqc-1.12.4/dt-1.13.1/datatables.min.css"/>
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/fixedheader/3.3.1/css/fixedHeader.bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/responsive/2.4.0/css/responsive.bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <title>DailyNota</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                padding: 20px 0;
            }

            .main-container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                padding: 20px;
                margin: 0 auto;
                max-width: 1400px;
                width: 95%;
            }

            .page-title {
                font-size: 2rem;
                font-weight: 700;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 20px;
                text-align: center;
            }

            .version-info {
                text-align: center;
                font-size: 0.75rem;
                color: #999;
                margin-bottom: 15px;
                font-weight: 500;
            }

            .btn-add {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                padding: 8px 16px;
                border-radius: 10px;
                color: white;
                font-weight: 600;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
                width: auto;
                margin-bottom: 15px;
                order: 0;
                font-size: 0.9rem;
            }

            .btn-add:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
                color: white;
            }

            .table-wrapper {
                background: white;
                border-radius: 15px;
                padding: 0;
                margin-top: 15px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
                overflow-x: auto;
                display: flex;
                flex-direction: column;
            }

            #table_data {
                border-radius: 10px;
                overflow: hidden;
                margin-bottom: 0;
                order: 3;
            }

            #table_data thead {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            #table_data thead th {
                border: none;
                padding: 12px 8px;
                font-weight: 600;
                text-transform: uppercase;
                font-size: 0.75rem;
                letter-spacing: 0.5px;
                white-space: nowrap;
                text-align: center;
            }

            #table_data tbody tr {
                transition: all 0.3s ease;
            }

            #table_data tbody tr:hover {
                background-color: #f8f9ff;
            }

            #table_data tbody td {
                padding: 10px 8px;
                vertical-align: middle;
                font-size: 0.9rem;
            }

            .btn-circle {
                border: none;
                border-radius: 50%;
                width: 25px;
                height: 25px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                font-size: 0.75rem;
                margin: 0 3px;
                color: white;
                box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
                cursor: pointer;
                border: 2px solid transparent;
            }

            .btn-circle:hover {
                transform: translateY(-2px) scale(1.1);
            }

            .btn-edit {
                background: linear-gradient(135deg, #ffc107 0%, #ffb300 100%);
                color: #333;
            }

            .btn-edit:hover {
                box-shadow: 0 5px 15px rgba(255, 193, 7, 0.5);
            }

            .btn-view {
                background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
                color: white;
            }

            .btn-view:hover {
                box-shadow: 0 5px 15px rgba(40, 167, 69, 0.5);
            }

            .action-buttons {
                display: flex;
                justify-content: center;
                gap: 8px;
            }

            .modal-dialog {
                max-width: 400px;
            }

            .modal-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border-radius: 20px 20px 0 0;
                padding: 12px 16px;
                border: none;
            }

            .modal-header .modal-title {
                font-weight: 700;
                font-size: 1rem;
            }

            .modal-header .btn-close {
                filter: brightness(0) invert(1);
            }

            .modal-body {
                padding: 15px;
            }

            .modal-body .form-label {
                font-weight: 600;
                color: #333;
                margin-bottom: 4px;
                font-size: 0.85rem;
            }

            .modal-body .form-control,
            .modal-body .form-select {
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                padding: 8px 10px;
                transition: all 0.3s ease;
                font-size: 0.9rem;
            }

            .modal-body .form-control:focus,
            .modal-body .form-select:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }

            .form-control.is-invalid {
                border-color: #dc3545;
            }

            .invalid-feedback {
                color: #dc3545;
                font-size: 0.85rem;
                margin-top: 2px;
                display: block;
            }

            .mb-3 {
                margin-bottom: 10px !important;
            }

            .modal-footer {
                border: none;
                padding: 12px 15px;
                gap: 10px;
            }

            .modal-footer .btn-success {
                background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
                border: none;
                padding: 10px 25px;
                border-radius: 10px;
                font-weight: 600;
                transition: all 0.3s ease;
                flex: 1;
                font-size: 0.9rem;
                color: white;
            }

            .modal-footer .btn-success:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
            }

            .modal-footer .btn-secondary {
                flex: 1;
            }

            .dataTables_wrapper {
                display: flex;
                flex-direction: column;
            }

            .dataTables_wrapper .dataTables_filter {
                text-align: right;
                margin-bottom: 15px;
                padding: 0;
            }

            .dataTables_wrapper .dataTables_filter label {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                color: #667eea;
                font-size: 0.9rem;
            }

            .dataTables_wrapper .dataTables_filter input {
                border: 2px solid #e0e0e0;
                border-radius: 12px;
                padding: 10px 15px;
                margin-left: 0;
                width: 250px;
                transition: all 0.3s ease;
                background: #f8f9ff;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_filter input:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
                background: white;
            }

            .dataTables_wrapper .dataTables_filter input::placeholder {
                color: #999;
            }

            .dataTables_wrapper .dataTables_length {
                float: none;
                margin-bottom: 0;
                padding: 0;
                order: 2;
            }

            .dataTables_wrapper .dataTables_length label {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                color: #667eea;
                font-size: 0.9rem;
                margin: 0;
            }

            .dataTables_wrapper .dataTables_length select {
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                padding: 8px 12px;
                background: #f8f9ff;
                transition: all 0.3s ease;
                cursor: pointer;
                font-size: 0.95rem;
            }

            .dataTables_wrapper .dataTables_length select:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
                background: white;
            }

            .dataTables_wrapper .dataTables_info {
                padding: 10px;
                font-size: 0.85rem;
                color: #666;
                font-weight: 500;
                order: 4;
            }

            .dataTables_wrapper .dataTables_paginate {
                padding: 10px;
                order: 5;
                display: flex;
                justify-content: flex-end;
                gap: 5px;
                flex-wrap: wrap;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button {
                padding: 6px 8px !important;
                border-radius: 4px !important;
                margin: 0 1px !important;
                font-size: 0.85rem !important;
                font-weight: 500 !important;
                color: #333 !important;
                background: transparent !important;
                border: none !important;
                cursor: pointer !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.current {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                border: none !important;
                color: white !important;
                border-radius: 4px;
                font-weight: 700 !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                border: none !important;
                color: white !important;
                border-radius: 4px;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.disabled {
                color: #999 !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.previous {
                border: none !important;
                background: transparent !important;
                padding: 0 6px !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.previous span.dt-prev {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #fff;
                box-shadow: 0 6px 16px rgba(102, 126, 234, 0.35);
                font-weight: 700;
                line-height: 1;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.previous:hover {
                background: transparent !important;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button.previous:active span.dt-prev {
                transform: translateY(1px);
            }

            @media (max-width: 768px) {
                .main-container {
                    padding: 15px;
                    width: 100%;
                    border-radius: 15px;
                }

                .page-title {
                    font-size: 1.5rem;
                    margin-bottom: 15px;
                }

                .btn-add {
                    padding: 10px 15px;
                    font-size: 0.95rem;
                }

                .table-wrapper {
                    padding: 10px;
                }

                #table_data thead th {
                    padding: 8px 5px;
                    font-size: 0.7rem;
                }

                #table_data tbody td {
                    padding: 8px 5px;
                    font-size: 0.8rem;
                }

                .btn-circle {
                    width: 36px;
                    height: 36px;
                    font-size: 0.95rem;
                    margin: 0 2px;
                }

                .action-buttons {
                    gap: 5px;
                }
            }

            @media (max-width: 576px) {
                body {
                    padding: 10px 0;
                }

                .main-container {
                    padding: 12px;
                    margin: 0 auto;
                }

                .page-title {
                    font-size: 1.3rem;
                }

                #table_data thead th {
                    padding: 6px 3px;
                    font-size: 0.65rem;
                }

                #table_data tbody td {
                    padding: 6px 3px;
                    font-size: 0.75rem;
                }

                .btn-circle {
                    width: 34px;
                    height: 34px;
                    font-size: 0.9rem;
                    margin: 0 1px;
                }

                .action-buttons {
                    gap: 3px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="main-container">
                <h1 class="page-title">DailyNota</h1>
                <div class="version-info">v2.0 © 2025</div>
                
                <button type="button" class="btn btn-add" id="tambahProduk">
                    + Tambah Produk
                </button>
                
                <div class="table-wrapper">
                    <table id="table_data" class="table table-striped table-bordered" style="width: 100%"></table>
                </div>
            </div>
        </div>
       
        <div class="modal" id="myModal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Tambah Produk</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
            
                    <div class="modal-body">
                        <form>
                            <input type="hidden" class="form-control" id="idProduk">
                            <div class="mb-3">
                                <label for="itemsProduk" class="form-label">Items</label>
                                <input type="text" class="form-control" id="itemsProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="supplierProduk" class="form-label">Supplier</label>
                                <input type="text" class="form-control" id="supplierProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="kotaProduk" class="form-label">Kota</label>
                                <input type="text" class="form-control" id="kotaProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="gudangProduk" class="form-label">Gudang</label>
                                <select class="form-control" id="gudangProduk" required>
                                    <option value="">Pilih Gudang</option>
                                    <option value="Kalipucang">Kalipucang</option>
                                    <option value="Sekarjati">Sekarjati</option>
                                    <option value="Troso">Troso</option>
                                    <option value="Ngabul">Ngabul</option>
                                    <option value="Masterbox">Masterbox</option>
                                    <option value="Innerbox">Innerbox</option>
                                    <option value="Flexo">Flexo</option>
                                    <option value="Mess">Mess</option>
                                    <option value="Kontrakan">Kontrakan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="tanggalProduk" class="form-label">Tanggal (dd/mm/yyyy)</label>
                                <input type="text" class="form-control" id="tanggalProduk" placeholder="dd/mm/yyyy" required>
                                <div class="invalid-feedback" id="tanggalError"></div>
                            </div>
                            <div class="mb-3">
                                <label for="hargaProduk" class="form-label">Harga</label>
                                <input type="text" class="form-control" id="hargaProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="satuanProduk" class="form-label">Satuan</label>
                                <select class="form-control" id="satuanProduk" required>
                                    <option value="">Pilih Satuan</option>
                                    <option value="klg">klg</option>
                                    <option value="ml">ml</option>
                                    <option value="ons">ons</option>
                                    <option value="gr">gr</option>
                                    <option value="pcs">pcs</option>
                                    <option value="lbr">lbr</option>
                                    <option value="btg">btg</option>
                                    <option value="roll">roll</option>
                                    <option value="kg">kg</option>
                                    <option value="ltr">ltr</option>
                                    <option value="m">m</option>
                                    <option value="cm">cm</option>
                                    <option value="box">box</option>
                                    <option value="pack">pack</option>
                                    <option value="unit">unit</option>
                                    <option value="set">set</option>
                                    <option value="rtg">rtg</option>
                                    <option value="lsn">lsn</option>
                                    <option value="gln">gln</option>
                                    <option value="lainnya">lainnya</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="stokProduk" class="form-label">Stok</label>
                                <input type="text" class="form-control" id="stokProduk" required>
                            </div>
                            <div class="mb-3">
                                <label for="deskripsiProduk" class="form-label">Deskripsi</label>
                                <textarea class="form-control" id="deskripsiProduk" rows="3" placeholder="Opsional"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="button" class="btn btn-success">Simpan</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" src="https://cdn.datatables.net/v/bs5/jqc-1.12.4/dt-1.13.1/datatables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.3/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.3/js/dataTables.bootstrap.min.js"></script>
        <script src="https://cdn.datatables.net/fixedheader/3.3.1/js/dataTables.fixedHeader.min.js"></script>
        <script src="https://cdn.datatables.net/responsive/2.4.0/js/dataTables.responsive.min.js"></script>
        <script src="https://cdn.datatables.net/responsive/2.4.0/js/responsive.bootstrap.min.js"></script>
        <script>
            $(document).ready(function () {
                const BASE_URL = "https://script.google.com/macros/s/AKfycbyt9jW3tMt6uxcu15T0M2IsMCSXrrLT31Dueh3VOc4Bx3vqk0EdVp_ErTMmAHN1v70A/exec";
                
                // Fungsi untuk encode nilai parameter URL
                function encodeURLParam(value) {
                    return encodeURIComponent(value);
                }
                
                // Fungsi validasi format dd/mm/yyyy
                function isValidTanggal(tanggal) {
                    const regex = /^\d{2}\/\d{2}\/\d{4}$/;
                    if (!regex.test(tanggal)) return false;
                    
                    const parts = tanggal.split('/');
                    const day = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10);
                    const year = parseInt(parts[2], 10);
                    
                    if (month < 1 || month > 12) return false;
                    if (day < 1 || day > 31) return false;
                    
                    // Cek hari valid untuk bulan tertentu
                    const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                    if (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) {
                        daysInMonth[1] = 29;
                    }
                    
                    return day <= daysInMonth[month - 1];
                }
                
                const table = $("#table_data").DataTable({
                    ajax: BASE_URL + "?action=get-product",
                    columns: [
                        { title: "NO", data: "id" },
                        { title: "ITEMS", data: "items" },
                        { title: "SUPPLIER", data: "supplier" },
                        { title: "KOTA", data: "kota" },
                        { title: "GUDANG", data: "gudang" },
                        {
                            title: "TANGGAL",
                            data: "tanggal",
                            render: function(data, type, row) {
                                // Tanggal sudah dalam format dd/mm/yyyy dari server
                                return data || '-';
                            }
                        },
                        {
                            title: "HARGA",
                            data: "harga",
                            className: "text-end",
                            render: function(data, type, row) {
                                if (type === 'display') {
                                    const number = parseFloat(data);
                                    if (isNaN(number)) return data;
                                    return number.toLocaleString('id-ID');
                                }
                                return data;
                            }
                        },
                        { title: "SATUAN", data: "satuan" },
                        { title: "STOK", data: "stok", visible: false },
                        {
                            title: "AKSI",
                            data: null,
                            className: "text-center",
                            render: function(data, type, row) {
                                return `
                                    <div class="action-buttons">
                                        <button class="btn-circle btn-edit edit" data-id="${row.id}" title="Edit">
                                            <i class="fas fa-pencil-alt"></i>
                                        </button>
                                        <button class="btn-circle btn-view view" data-id="${row.id}" title="Lihat">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                `;
                            }
                        }
                    ],
                    responsive: true,
                    language: {
                        paginate: {
                            previous: '<span class="dt-prev" aria-label="Sebelumnya">‹</span>'
                        }
                    }
                });

                $('#tambahProduk').on('click', () => {
                    clear();
                    $('#myModal').modal('show');
                    $('#myModal .modal-title').text('Tambah Produk');
                })

                $('#table_data tbody').on('click', '.edit', function () {
                    const data = table.row($(this).parents('tr')).data();
                    $('#idProduk').val(data.id);
                    $('#itemsProduk').val(data.items);
                    $('#supplierProduk').val(data.supplier);
                    $('#kotaProduk').val(data.kota);
                    $('#gudangProduk').val(data.gudang);
                    $('#tanggalProduk').val(data.tanggal); // Format sudah dd/mm/yyyy
                    $('#hargaProduk').val(data.harga);
                    $('#satuanProduk').val(data.satuan);
                    $('#stokProduk').val(data.stok);
                    $('#deskripsiProduk').val(data.deskripsi || '');
                    $('#myModal').modal('show');
                    $('#myModal .modal-title').text('Edit Produk');
                })

                $('#table_data tbody').on('click', '.view', function () {
                    const data = table.row($(this).parents('tr')).data();
                    const deskripsi = data.deskripsi || 'Tidak ada deskripsi';
                    alert('Deskripsi: ' + deskripsi);
                })

                $('.modal-footer .btn-success').on('click', () => {
                    const itemsProduk = $('#itemsProduk').val();
                    const supplierProduk = $('#supplierProduk').val();
                    const kotaProduk = $('#kotaProduk').val();
                    const gudangProduk = $('#gudangProduk').val();
                    const tanggalProduk = $('#tanggalProduk').val();
                    const hargaProduk = $('#hargaProduk').val();
                    const satuanProduk = $('#satuanProduk').val();
                    const stokProduk = $('#stokProduk').val();
                    const deskripsiProduk = $('#deskripsiProduk').val();
                    const idProduk = $('#idProduk').val();

                    // Validasi field wajib
                    if (itemsProduk == '' || supplierProduk == '' || kotaProduk == '' || gudangProduk == '' || tanggalProduk == '' || hargaProduk == '' || satuanProduk == '' || stokProduk == '') {
                        alert('Harap lengkapi semua field !');
                        return;
                    }

                    // Validasi format tanggal
                    if (!isValidTanggal(tanggalProduk)) {
                        $('#tanggalProduk').addClass('is-invalid');
                        $('#tanggalError').text('Format tanggal harus dd/mm/yyyy (contoh: 25/12/2025)');
                        return;
                    }

                    $('#tanggalProduk').removeClass('is-invalid');

                    // Bangun URL dengan encodeURIComponent untuk semua parameter
                    let apiUrl = BASE_URL;
                    
                    if (idProduk) {
                        // Untuk update
                        apiUrl += '?action=update' +
                                '&items=' + encodeURLParam(itemsProduk) +
                                '&supplier=' + encodeURLParam(supplierProduk) +
                                '&kota=' + encodeURLParam(kotaProduk) +
                                '&gudang=' + encodeURLParam(gudangProduk) +
                                '&tanggal=' + encodeURLParam(tanggalProduk) +
                                '&harga=' + encodeURLParam(hargaProduk) +
                                '&satuan=' + encodeURLParam(satuanProduk) +
                                '&stok=' + encodeURLParam(stokProduk) +
                                '&deskripsi=' + encodeURLParam(deskripsiProduk) +
                                '&id=' + encodeURLParam(idProduk);
                    } else {
                        // Untuk insert
                        apiUrl += '?action=insert' +
                                '&items=' + encodeURLParam(itemsProduk) +
                                '&supplier=' + encodeURLParam(supplierProduk) +
                                '&kota=' + encodeURLParam(kotaProduk) +
                                '&gudang=' + encodeURLParam(gudangProduk) +
                                '&tanggal=' + encodeURLParam(tanggalProduk) +
                                '&harga=' + encodeURLParam(hargaProduk) +
                                '&satuan=' + encodeURLParam(satuanProduk) +
                                '&stok=' + encodeURLParam(stokProduk) +
                                '&deskripsi=' + encodeURLParam(deskripsiProduk);
                    }

                    // Kirim permintaan dengan GET
                    $.getJSON(apiUrl, function(result) {
                        if (result.success) {
                            alert(result.message);
                            $('#myModal').modal('hide');
                            table.ajax.reload(null, false);
                            clear();
                        } else {
                            alert('Error: ' + result.message);
                        }
                    }).fail(function(jqXHR, textStatus, errorThrown) {
                        console.error('Request failed:', textStatus, errorThrown);
                        console.log('URL yang dikirim:', apiUrl);
                        alert('Gagal menyimpan data. Periksa koneksi internet Anda.');
                    });
                });
            });

            function clear() {
                $('#idProduk').val('');
                $('#itemsProduk').val('');
                $('#supplierProduk').val('');
                $('#kotaProduk').val('');
                $('#gudangProduk').val('');
                $('#tanggalProduk').val('');
                $('#hargaProduk').val('');
                $('#satuanProduk').val('');
                $('#stokProduk').val('');
                $('#deskripsiProduk').val('');
                $('#tanggalProduk').removeClass('is-invalid');
            }
        </script>
    </body>
</html>
